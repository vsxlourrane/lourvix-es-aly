<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumbo a España: Pasaporte de Alyson</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --gold: #FFD700;
    --black: #0a0a0a;
    --dark-grey: #1a1a1a;
    --light-grey: #2a2a2a;
    --text: #f4f4f4;
    --green: #25D366;
    --shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--black);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(200, 16, 46, 0.15) 0%, transparent 50%),
      linear-gradient(0deg, rgba(255, 215, 0, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 20px 20px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ============ HEADER ============ */
  header {
    background: rgba(10,10,10,0.9);
    border-bottom: 2px solid var(--gold);
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--gold);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .logo span { color: var(--red); }

  .progress-bar-container {
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: 'Share Tech Mono', monospace;
    color: var(--gold);
    font-size: 14px;
  }

  .progress-bar-bg {
    width: 200px;
    height: 10px;
    background: var(--light-grey);
    border-radius: 5px;
    border: 1px solid #333;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    width: 0%;
    transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ============ LAYOUT ============ */
  .main-container {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 30px;
    max-width: 1300px;
    margin: 30px auto;
    padding: 0 20px;
    width: 100%;
  }

  /* --- ÁREA DO JOGO --- */
  .game-area {
    background: var(--dark-grey);
    border: 1px solid #333;
    border-radius: 16px;
    padding: 30px;
    box-shadow: var(--shadow);
    position: relative;
    min-height: 600px;
    display: flex;
    flex-direction: column;
  }

  .phase-header {
    margin-bottom: 25px;
    border-bottom: 1px solid #333;
    padding-bottom: 15px;
  }

  .phase-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--gold);
    letter-spacing: 1px;
    line-height: 1;
  }

  .phase-desc {
    color: #aaa;
    font-size: 15px;
    margin-top: 8px;
  }

  /* --- BOTÕES --- */
  .btn-main {
    background: var(--red);
    color: #fff;
    border: 2px solid var(--gold);
    padding: 15px 30px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 15px rgba(200, 16, 46, 0.4);
    margin-top: auto;
    align-self: flex-start;
  }

  .btn-main:hover {
    background: var(--gold);
    color: var(--black);
    border-color: var(--red);
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
  }

  .btn-main:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ============ FASE 1: AEROPORTO ============ */
  .signs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
  }

  .sign-card {
    background: #111;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 120px;
  }

  .sign-card:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
    background: #1a1a1a;
  }

  .sign-card.correct {
    border-color: var(--green);
    background: rgba(37, 211, 102, 0.1);
    pointer-events: none;
  }

  .sign-card.wrong {
    border-color: var(--red);
    background: rgba(200, 16, 46, 0.3);
    animation: shake 0.3s;
  }

  .sign-card .es { font-size: 16px; font-weight: 800; color: var(--gold); margin-bottom: 5px; font-family: 'Share Tech Mono', monospace; }
  .sign-card .desc { font-size: 12px; color: #aaa; }
  .sign-card .icon { font-size: 28px; margin-bottom: 8px; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* ============ FASE 2: QUIZ ============ */
  .quiz-container { display: flex; flex-direction: column; gap: 15px; }
  
  .quiz-header { display: flex; justify-content: space-between; font-family: 'Share Tech Mono'; color: var(--gold); margin-bottom: 10px; }

  .quiz-question {
    background: #111;
    padding: 20px;
    border-left: 4px solid var(--red);
    border-radius: 4px;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .quiz-options { display: flex; flex-direction: column; gap: 10px; }

  .quiz-option {
    background: #1a1a1a;
    border: 1px solid #444;
    padding: 15px 20px;
    border-radius: 8px;
    color: #fff;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .quiz-option:hover:not(.disabled) { background: #2a2a2a; border-color: var(--gold); }
  .quiz-option.correct { background: var(--green); color: #000; font-weight: bold; pointer-events: none; }
  .quiz-option.wrong { background: var(--red); color: #fff; pointer-events: none; }
  .quiz-option.disabled { cursor: not-allowed; opacity: 0.7; }

  /* ============ FASE 3: TRANSPORTE ============ */
  .transport-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
  
  .trans-card {
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s;
  }
  .trans-card .word { font-size: 22px; font-weight: bold; color: var(--gold); margin-bottom: 10px; font-family: 'Bebas Neue'; letter-spacing: 1px; }
  .trans-card .meaning { font-size: 14px; color: #ccc; }

  .phrase-builder { background: #111; border-radius: 8px; padding: 20px; border: 1px solid #333; margin-bottom: 20px; }
  .phrase-title { color: var(--gold); font-family: 'Bebas Neue'; font-size: 20px; margin-bottom: 10px; }
  .phrase-text { font-family: 'Share Tech Mono'; color: var(--text); font-size: 15px; margin-bottom: 15px; background: #000; padding: 10px; border-radius: 4px; border-left: 3px solid var(--red); }
  .phrase-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .phrase-btn { background: #222; border: 1px solid #555; color: #fff; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .phrase-btn:hover { background: var(--gold); color: #000; }

  /* ============ FASE 4: EMERGÊNCIAS ============ */
  .emergency-grid { display: flex; flex-direction: column; gap: 15px; }
  .scenario-card {
    background: #111;
    border-left: 5px solid var(--red);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .scenario-title { font-weight: bold; font-size: 18px; color: var(--gold); display: flex; align-items: center; gap: 10px; }
  .scenario-info { font-size: 14px; color: #ccc; font-family: 'Share Tech Mono'; }
  .scenario-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .scenario-btn { background: #222; border: 1px solid #555; color: #fff; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .scenario-btn:hover { background: var(--gold); color: #000; }
  .scenario-btn.correct { background: var(--green); color: #000; pointer-events: none; }

  /* ============ FINAL ============ */
  .final-screen { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; }
  .final-screen h2 { font-family: 'Bebas Neue'; font-size: 50px; color: var(--gold); letter-spacing: 2px; }
  .final-screen p { font-size: 18px; color: #aaa; max-width: 500px; }
  .tip-box { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--gold); padding: 20px; border-radius: 8px; font-size: 15px; color: var(--gold); max-width: 600px; text-align: left; }

  /* ============ PASSAPORTE ============ */
  .passport-sidebar {
    background: #151515;
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
    position: sticky;
    top: 90px;
    height: calc(100vh - 120px);
  }

  .passport-title {
    font-family: 'Bebas Neue';
    font-size: 28px;
    color: var(--gold);
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
  }

  .passport-info { font-family: 'Share Tech Mono'; font-size: 12px; color: #888; margin-bottom: 20px; }
  .passport-info strong { color: var(--text); }

  .stamps-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Carimbos */
  .stamp-slot {
    width: 130px;
    height: 130px;
    border: 2px dashed #444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-family: 'Bebas Neue';
    font-size: 18px;
    text-align: center;
    position: absolute;
    transition: all 0.5s;
    background: #111;
  }

  .stamp-slot:nth-child(1) { top: 5%; left: 5%; transform: rotate(-15deg); }
  .stamp-slot:nth-child(2) { top: 30%; right: 5%; transform: rotate(10deg); }
  .stamp-slot:nth-child(3) { bottom: 30%; left: 10%; transform: rotate(5deg); }
  .stamp-slot:nth-child(4) { bottom: 5%; right: 10%; transform: rotate(-20deg); }

  /* Carimbo Aprovado (Vermelho e Amarelo) */
  .stamp-slot.filled {
    border: 4px solid var(--red);
    color: var(--red);
    background: rgba(200, 16, 46, 0.05);
    box-shadow: inset 0 0 15px rgba(200, 16, 46, 0.3), 0 0 20px rgba(255, 215, 0, 0.2);
    animation: stampIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    flex-direction: column;
  }

  .stamp-slot.filled::before {
    content: '⭐';
    color: var(--gold);
    font-size: 24px;
    margin-bottom: 5px;
    text-shadow: 0 0 10px var(--gold);
  }

  .stamp-slot.filled::after {
    content: 'APROBADO';
    position: absolute;
    bottom: 15px;
    font-size: 14px;
    color: var(--gold);
    font-family: 'Share Tech Mono';
    letter-spacing: 2px;
    font-weight: bold;
  }

  @keyframes stampIn {
    0% { transform: scale(3) rotate(-30deg); opacity: 0; }
    70% { transform: scale(0.9) rotate(-15deg); opacity: 1; }
    100% { transform: scale(1) rotate(-15deg); opacity: 1; }
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
    border: 3px solid var(--red);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
    animation: modalPop 0.4s ease;
    position: relative;
  }
  .modal-content::before {
    content: '';
    position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
    border: 1px dashed var(--gold);
    border-radius: 12px;
    pointer-events: none;
  }
  @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-content h2 { font-family: 'Bebas Neue'; font-size: 42px; color: var(--gold); margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
  .modal-content p { color: #ccc; margin-bottom: 25px; font-size: 16px; line-height: 1.5; }

  @media (max-width: 900px) {
    .main-container { grid-template-columns: 1fr; }
    .passport-sidebar { height: auto; position: relative; top: 0; min-height: 400px; }
    .stamps-container { min-height: 300px; }
  }

  @media (max-width: 600px) {
    .transport-grid { grid-template-columns: 1fr; }
    .logo { font-size: 22px; }
    .progress-bar-bg { width: 100px; }
    .stamp-slot { width: 100px; height: 100px; font-size: 14px; }
    .stamp-slot.filled::after { bottom: 5px; font-size: 10px; }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">RUMBO A <span>ESPAÑA</span> 🇪🇸</div>
    <div class="progress-bar-container">
      <span id="progress-text">0/4 Etapas</span>
      <div class="progress-bar-bg">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </header>

  <!-- CONTAINER -->
  <div class="main-container">
    
    <div class="game-area" id="game-area">
      <!-- Conteúdo dinâmico -->
    </div>

    <div class="passport-sidebar">
      <div class="passport-title">PASAPORTE DE ALYSON</div>
      <div class="passport-info">
        <div>NACIONALIDAD: <strong>Brasileña</strong></div>
        <div>DESTINO: <strong>Madrid / Barcelona</strong></div>
        <div>ESTADO: <strong id="status-text">En vuelo...</strong></div>
      </div>
      
      <div class="stamps-container" id="stamps-container">
        <div class="stamp-slot" id="slot-1">ETAPA 1</div>
        <div class="stamp-slot" id="slot-2">ETAPA 2</div>
        <div class="stamp-slot" id="slot-3">ETAPA 3</div>
        <div class="stamp-slot" id="slot-4">ETAPA 4</div>
      </div>
    </div>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h2>¡ESTADÍA APROBADA!</h2>
      <p id="modal-desc">Has superado la Etapa 1. El oficial ha sellado tu pasaporte. ¡Puedes continuar!</p>
      <button class="btn-main" onclick="nextPhase()">SIGUIENTE DESTINO →</button>
    </div>
  </div>

<script>
  let currentPhase = 1;
  const totalPhases = 4;
  let stampsEarned = 0;

  const gameArea = document.getElementById('game-area');
  const modal = document.getElementById('modal');
  const modalDesc = document.getElementById('modal-desc');
  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');
  const statusText = document.getElementById('status-text');

  /* ==========================================
     ETAPA 1: AEROPUERTO (SINALIZAÇÕES)
     ========================================== */
  function renderPhase1() {
    const signs = [
      { es: "Control de Pasaportes / Inmigración", desc: "Tu primer destino al llegar.", icon: "🛂" },
      { es: "Todos los Pasaportes / Ciudadanos No UE", desc: "La fila para brasileños.", icon: "🇧🇷" },
      { es: "Recogida de Equipajes", desc: "Para retirar tus maletas.", icon: "🧳" },
      { es: "Aduana", desc: "Donde revisan lo que llevas.", icon: "🛃" },
      { es: "Salida", desc: "La puerta para irte del aeropuerto.", icon: "🚪" },
      { es: "Tránsito / Conexiones", desc: "Si vas a tomar otro vuelo.", icon: "✈️" }
    ];

    let html = `
      <div class="phase-header">
        <div class="phase-title">ETAPA 1: EL AEROPUERTO</div>
        <div class="phase-desc">Acabas de aterrizar. Haz clic en la señal que indica <strong>"Recogida de Equipajes"</strong> para recuperar tu maleta.</div>
      </div>
      <div class="signs-grid">
    `;

    signs.forEach((sign) => {
      html += `
        <div class="sign-card" onclick="checkSign(this, '${sign.es}', 'Recogida de Equipajes')">
          <div class="icon">${sign.icon}</div>
          <div class="es">${sign.es}</div>
          <div class="desc">${sign.desc}</div>
        </div>
      `;
    });

    html += `</div>`;
    gameArea.innerHTML = html;
  }

  function checkSign(element, selected, correct) {
    if (selected === correct) {
      element.classList.add('correct');
      setTimeout(() => completePhase(1), 600);
    } else {
      element.classList.add('wrong');
      setTimeout(() => element.classList.remove('wrong'), 500);
    }
  }

  /* ==========================================
     ETAPA 2: INMIGRAÇÃO (10 PERGUNTAS)
     ========================================== */
  const immQuestions = [
    {
      q: "Oficial: '¿Cuál es el motivo de su viaje?' (Você está a turismo)",
      opts: ["Vengo por negocios.", "Vengo por turismo.", "Me quedo por diez días."],
      ans: 1
    },
    {
      q: "Oficial: '¿A qué viene a España?' (Você está a negócios)",
      opts: ["Vengo por turismo.", "Vengo por negocios.", "En casa de un amigo."],
      ans: 1
    },
    {
      q: "Oficial: '¿Cuánto tiempo se va a quedar?' (Você vai ficar 10 dias)",
      opts: ["Me quedo por diez días.", "Llevo tarjeta de crédito.", "Vengo por turismo."],
      ans: 0
    },
    {
      q: "Oficial: '¿Cuántos días se queda?' (Você responde que tem a passagem de volta)",
      opts: ["Me quedo en un hotel.", "Aquí está mi billete de vuelta.", "Vengo por negocios."],
      ans: 1
    },
    {
      q: "Oficial: '¿Dónde se va a hospedar?' (Você vai ficar num hotel)",
      opts: ["Me voy a quedar en un hotel.", "En casa de un amigo.", "Vengo por turismo."],
      ans: 0
    },
    {
      q: "Oficial: '¿Dónde va a quedarse?' (Você vai ficar na casa de um amigo)",
      opts: ["Me quedo en un hotel.", "Me quedo en casa de un amigo.", "Llevo efectivo."],
      ans: 1
    },
    {
      q: "Oficial: '¿Lleva suficiente dinero para su estancia?'",
      opts: ["Me quedo diez días.", "Vengo por turismo.", "Llevo dinero en efectivo y tarjetas de crédito."],
      ans: 2
    },
    {
      q: "Oficial: '¿Cómo va a financiar su viaje?'",
      opts: ["Aquí tiene mi pasaporte.", "Con tarjeta de crédito y efectivo.", "En un hotel."],
      ans: 1
    },
    {
      q: "Oficial fala muito rápido. O que você diz para ele repetir?",
      opts: ["No entiendo nada.", "¿Puede repetir, por favor, más despacio?", "Vengo por turismo."],
      ans: 1
    },
    {
      q: "Oficial: '¿Tiene seguro de viaje?'",
      opts: ["Sí, aquí está mi seguro de viaje.", "Me quedo diez días.", "En casa de un amigo."],
      ans: 0
    }
  ];

  let currentQIndex = 0;

  function renderPhase2() {
    currentQIndex = 0;
    gameArea.innerHTML = `
      <div class="phase-header">
        <div class="phase-title">ETAPA 2: LA INMIGRACIÓN</div>
        <div class="phase-desc">Responde correctamente a las 10 preguntas del oficial para liberar tu entrada.</div>
      </div>
      <div class="quiz-container" id="quiz-container"></div>
    `;
    loadImmQuestion();
  }

  function loadImmQuestion() {
    const container = document.getElementById('quiz-container');
    if (currentQIndex >= immQuestions.length) {
      completePhase(2);
      return;
    }

    const q = immQuestions[currentQIndex];
    let html = `
      <div class="quiz-header">
        <span>Pregunta ${currentQIndex + 1} / 10</span>
        <span>Inmigración</span>
      </div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">
    `;

    q.opts.forEach((opt, i) => {
      html += `<button class="quiz-option" onclick="checkImmAnswer(this, ${i}, ${q.ans})">${opt}</button>`;
    });

    html += `</div>`;
    container.innerHTML = html;
  }

  function checkImmAnswer(btn, selected, correct) {
    const opts = document.querySelectorAll('.quiz-option');
    opts.forEach(o => o.classList.add('disabled'));

    if (selected === correct) {
      btn.classList.add('correct');
      setTimeout(() => {
        currentQIndex++;
        loadImmQuestion();
      }, 800);
    } else {
      btn.classList.add('wrong');
      opts[correct].classList.add('correct');
      setTimeout(() => {
        currentQIndex++;
        loadImmQuestion();
      }, 1500);
    }
  }

  /* ==========================================
     ETAPA 3: TRANSPORTE E FRASES ÚTEIS
     ========================================== */
  function renderPhase3() {
    gameArea.innerHTML = `
      <div class="phase-header">
        <div class="phase-title">ETAPA 3: EL TRANSPORTE</div>
        <div class="phase-desc">Vocabulario clave y frases para moverte por España. Pregunta precio, hora y lugar.</div>
      </div>
      
      <div class="transport-grid">
        <div class="trans-card"><div class="word">Billete</div><div class="meaning">Pasaje / Ingresso (No uses 'pasaje')</div></div>
        <div class="trans-card"><div class="word">Autobús</div><div class="meaning">Ônibus (No uses 'bus' o 'colectivo')</div></div>
        <div class="trans-card"><div class="word">Coche</div><div class="meaning">Carro (No uses 'carro' o 'auto')</div></div>
        <div class="trans-card"><div class="word">Andén</div><div class="meaning">Plataforma de embarque (tren/metrô)</div></div>
      </div>

      <div class="phrase-builder">
        <div class="phrase-title">💬 Frases Esenciales</div>
        <div class="phrase-text">¿Cuánto cuesta el billete de metro? <br><small>(Quanto custa a passagem de metrô?)</small></div>
        <div class="phrase-text">¿A qué hora sale el próximo tren? <br><small>(A que horas sai o próximo trem?)</small></div>
        <div class="phrase-text">¿De qué andén sale el tren hacia Sevilla? <br><small>(De qual plataforma sai o trem para Sevilla?)</small></div>
      </div>

      <button class="btn-main" onclick="completePhase(3)">CONTINUAR →</button>
    `;
  }

  /* ==========================================
     ETAPA 4: EMERGÊNCIAS
     ========================================== */
  function renderPhase4() {
    gameArea.innerHTML = `
      <div class="phase-header">
        <div class="phase-title">ETAPA 4: EMERGENCIAS</div>
        <div class="phase-desc">Número de Emergência Europeu: <strong>112</strong>. Elige el lugar correcto para cada situación.</div>
      </div>
      <div class="emergency-grid">
        
        <div class="scenario-card">
          <div class="scenario-title">💊 Cenário A: Farmacia (Cruz verde luminosa)</div>
          <div class="scenario-info">Vocabulario: Pastillas, jarabe, receta médica, dolor de cabeza/estómago.<br>Frase: "Necesito algo para el mareo/dolor, por favor."</div>
          <div class="scenario-actions">
            <button class="scenario-btn" onclick="checkEmergency(this, 'Farmacia')">Ir a la Farmacia</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Policia')">Ir a la Comisaría</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Hospital')">Ir al Hospital</button>
          </div>
        </div>

        <div class="scenario-card">
          <div class="scenario-title">🚑 Cenário B: Urgencias (Hospital)</div>
          <div class="scenario-info">Vocabulario: Ambulancia, seguro de viaje, tarjeta sanitaria, herida, fiebre.<br>Frase: "Tengo que ir a urgencias, no me encuentro bien."</div>
          <div class="scenario-actions">
            <button class="scenario-btn" onclick="checkEmergency(this, 'Farmacia')">Ir a la Farmacia</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Policia')">Ir a la Comisaría</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Urgencias')">Ir a Urgencias</button>
          </div>
        </div>

        <div class="scenario-card">
          <div class="scenario-title">🕵️ Cenário C: Comisaría de Policía</div>
          <div class="scenario-info">Vocabulario: Denuncia, robo (violência), hurto (furto descuidado), perder los documentos, cartera.<br>Frase: "Me han hurtado la cartera en el metro. Necesito poner una denuncia."</div>
          <div class="scenario-actions">
            <button class="scenario-btn" onclick="checkEmergency(this, 'Farmacia')">Ir a la Farmacia</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Comisaría')">Ir a la Comisaría</button>
            <button class="scenario-btn" onclick="checkEmergency(this, 'Urgencias')">Ir a Urgencias</button>
          </div>
        </div>

      </div>
      <button class="btn-main" style="margin-top:20px;" onclick="completePhase(4)">FINALIZAR MISIÓN →</button>
    `;
  }

  function checkEmergency(btn, correct) {
    const text = btn.textContent.toLowerCase();
    let isCorrect = false;
    
    if (correct === 'Farmacia' && text.includes('farmacia')) isCorrect = true;
    if (correct === 'Urgencias' && text.includes('urgencias')) isCorrect = true;
    if (correct === 'Comisaría' && text.includes('comisaría')) isCorrect = true;

    if (isCorrect) {
      btn.style.background = "var(--green)";
      btn.style.color = "#000";
      btn.style.pointerEvents = "none";
    } else {
      btn.style.background = "var(--red)";
      btn.style.color = "#fff";
      btn.style.animation = "shake 0.3s";
      setTimeout(() => { btn.style.animation = ""; }, 300);
    }
  }

  /* ==========================================
     CARIMBO E LÓGICA DE PROGRESSO
     ========================================== */
  function completePhase(phaseNum) {
    const slot = document.getElementById(`slot-${phaseNum}`);
    if (slot && !slot.classList.contains('filled')) {
      slot.classList.add('filled');
      slot.textContent = ""; // O CSS adiciona o "APROBADO" e a estrela
      stampsEarned++;
      
      progressText.textContent = `${stampsEarned}/${totalPhases} Etapas`;
      progressFill.style.width = `${(stampsEarned / totalPhases) * 100}%`;

      // Mensagem personalizada no modal
      const messages = [
        "Has superado la Etapa 1. El oficial ha sellado tu pasaporte. ¡Puedes continuar!",
        "¡Inmigración superada! Tu entrada ha sido aprobada. Siguiente parada: Transporte.",
        "¡Ya sabes moverte! Tu pasaporte tiene el sello de transporte. Última etapa: Emergencias.",
        "¡Misión cumplida! Has llegado a España sin problemas. ¡Disfruta tu estadía!"
      ];

      modalDesc.textContent = messages[phaseNum - 1];
      modal.classList.add('active');
    }
  }

  function nextPhase() {
    modal.classList.remove('active');
    currentPhase++;
    
    if (currentPhase > totalPhases) {
      showFinalScreen();
      return;
    }

    const statuses = ["En vuelo...", "Pasando por inmigración...", "Explorando el transporte...", "Lidando con emergencias..."];
    statusText.textContent = statuses[currentPhase - 1] || "¡Bienvenido a España!";

    if (currentPhase === 2) renderPhase2();
    else if (currentPhase === 3) renderPhase3();
    else if (currentPhase === 4) renderPhase4();
  }

  /* ==========================================
     TELA FINAL
     ========================================== */
  function showFinalScreen() {
    statusText.textContent = "¡Bienvenido a España!";
    statusText.style.color = "var(--green)";
    
    gameArea.innerHTML = `
      <div class="final-screen">
        <h2>¡MISIÓN CUMPLIDA!</h2>
        <div style="font-size: 60px; margin: 20px 0;">🛂🇪🇸🔥</div>
        <p>Has completado todas las etapas. Tu pasaporte está oficialmente sellado y aprobado.</p>
        
        <div class="tip-box">
          <strong>💡 Dica Cultural Express:</strong><br>
          Na Espanha, o atendimento pode parecer muito direto ou ríspido para os padrões brasileiros, mas é apenas o estilo cultural deles (son muy directos). Use sempre <strong>"Por favor"</strong> e <strong>"Gracias"</strong>. 
          <br><br>
          <strong>Desafio Final:</strong> Liste 3 palavras novas que você aprendeu hoje e que serão essenciais na sua chegada!
        </div>

        <button class="btn-main" style="margin-top: 20px;" onclick="location.reload()">REINICIAR JOGO ↻</button>
      </div>
    `;
  }

  /* ==========================================
     INIT
     ========================================== */
  renderPhase1();

</script>
</body>
</html>
